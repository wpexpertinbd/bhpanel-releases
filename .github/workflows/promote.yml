name: promote

# Makes a beta version the stable channel's, after the owner approves the
# "sign" environment: one that ran at least 7 days in beta (ci/promote.sh), or
# a security fix. Run by hand.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The beta version to make stable (e.g. 0.2.162) - at least 7 days in beta
        required: true
        type: string
      security:
        description: A security fix - skip the 7 days in beta
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    environment: sign
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.0"
          cache: false
      - name: Sign and publish to stable
        env:
          GH_TOKEN: ${{ github.token }}
          BHP_RELEASE_KEY: ${{ secrets.BHP_RELEASE_KEY }}
          V: ${{ inputs.version }}
          SEC: ${{ inputs.security && 'security' || '' }}
        run: bash ci/promote.sh "$V" ${SEC:+"$SEC"}
